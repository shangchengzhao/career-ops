          - generic [ref=f17e63]:
            - paragraph [ref=f17e65]: Waymo is an autonomous driving technology company with the mission to be the world's most trusted driver. Since its start as the Google Self-Driving Car Project in 2009, Waymo has focused on building the Waymo Driver—The World's Most Experienced Driver™—to improve access to mobility while saving thousands of lives now lost to traffic crashes. The Waymo Driver powers Waymo’s fully autonomous ride-hail service and can also be applied to a range of vehicle platforms and product use cases. The Waymo Driver has provided over ten million rider-only trips, enabled by its experience autonomously driving over 100 million miles on public roads and tens of billions in simulation across 15+ U.S. states.
            - paragraph [ref=f17e66]: The Human Behavior Analytics (HBA) team, part of the Waymo Safety team, conducts research and development on computational road user behavior models and other methods and tools used for evaluating the behavior and safety of the Waymo Driver. This work typically exists at the intersection between AI/ML and cognitive science and is done in close collaboration with other Waymo teams, in particular SW Research, Systems Engineering, Simulation and Data Science. The HBA team also engages extensively in research with external academic partners.
            - paragraph [ref=f17e67]: "Waymo interns partner with leaders in the industry on projects that create impact to the company. We believe learning is a two-way street: applying your knowledge while providing you with opportunities to expand your skill-set. Interns are an important part of our culture and our recruiting pipeline. Join us at Waymo for a fun and rewarding internship!"
            - paragraph [ref=f17e68]
            - paragraph [ref=f17e69]:
              - strong [ref=f17e70]: "You will:"
            - list [ref=f17e71]:
              - listitem [ref=f17e72]: Survey the state-of-the-art in digital neuroscience / cognitive science and mechanistic interpretability
              - listitem [ref=f17e73]: Develop models able to represent some select aspects of human driving behavior not typically accounted for by existing data-driven ML models (e.g., collision avoidance, road user interaction or visual behavior)
              - listitem [ref=f17e74]: Explore and demonstrate different ways in which the internal mechanisms of these models can be interpreted and explained
            - paragraph [ref=f17e75]
            - paragraph [ref=f17e76]:
              - strong [ref=f17e77]: "You have:"
            - list [ref=f17e78]:
              - listitem [ref=f17e79]: A strong research background and expertise in cognitive science and / or neuroscience
              - listitem [ref=f17e80]: Expertise in contemporary AI and machine learning
              - listitem [ref=f17e81]: Strong documented computational skills (math and coding)
            - paragraph [ref=f17e82]
            - paragraph [ref=f17e83]:
              - strong [ref=f17e84]: "We prefer:"
            - list [ref=f17e85]:
              - listitem [ref=f17e86]: Specific experience from research on mechanistic interpretability
            - paragraph [ref=f17e87]:
              - strong [ref=f17e88]: "General Perks:"
            - list [ref=f17e89]:
              - listitem [ref=f17e90]: Help solve challenging problems with a direct impact on the company
              - listitem [ref=f17e91]: Competitive compensation packages with a housing/relocation bonus (if applicable)
              - listitem [ref=f17e92]: Medical, dental, and vision insurance
              - listitem [ref=f17e93]: Fun intern events and networking opportunities
            - paragraph [ref=f17e94]:
              - strong [ref=f17e95]: "Onsite Perks:"
            - list [ref=f17e96]:
              - listitem [ref=f17e97]: Free breakfast, lunch, dinner, and snacks
              - listitem [ref=f17e98]: Free access to Google shuttles
              - listitem [ref=f17e99]: Onsite gym
            - paragraph [ref=f17e100]
            - paragraph [ref=f17e101]: "Note: This will be a hybrid onsite internship position. We will accept resumes on a rolling basis until the role is filled. To be in consideration for multiple roles, you will need to apply to each one individually - please apply to the top 3 roles you are interested in.At Waymo, we don’t just accept differences - we celebrate it, we support it, and we thrive on it for the benefit of our employees, our products and our community. We are committed to equal employment opportunity regardless of race, color, ancestry, religion, sex, national origin, sexual orientation, age, citizenship, marital status, disability, gender identity or Veteran status. We also consider qualified applicants regardless of criminal histories, consistent with legal requirements. If you have a disability or special need that requires accommodation, please let us know."
            - generic [ref=f17e103]:
              - generic [ref=f17e104]: The expected hourly rate for this full-time position is listed below. Interns are also eligible to participate in the Company’s generous benefits programs, subject to eligibility requirements.
              - generic [ref=f17e106]: Hourly PhD Pay
              - generic [ref=f17e107]: $85—$85 USD
        - paragraph [ref=f17e111]: We appreciate your interest in Waymo. Waymo is proud to be an equal opportunity employer, committed to creating a culture of belonging and maintaining a supportive workplace for all employees. We welcome applicants of all backgrounds, and employment decisions are based on a candidate’s qualifications, experience, and alignment with job requirements and business needs. Waymo does not discriminate against, and prohibits harassment of, any applicant or employee based on race, color, sex, sexual orientation, gender identity, religion, national origin, age, disability, military status, family status, pregnancy, genetic information or any other basis protected by applicable law. Waymo will also consider for employment qualified applicants with criminal records in accordance with applicable law. Waymo is committed to making sure our hiring process is accessible for all candidates. If you need assistance applying for a role or participating in the interview process due to a disability, please let the recruiting team know or email waymo-candidatesupport@google.com. (This email address is intended to be used only for requesting accommodations as part of the application process. Other inquiries will not receive a response.)
